name: Container-Image

# Baut das Image bei jeder Versionsmarkierung (z. B. v1.0.0) und auf Wunsch manuell.
# Ergebnis: ghcr.io/<besitzer>/<repository>:<version> und :latest für amd64 und arm64.
# Ein Push auf den Zweig "test" erzeugt nur :test (Vorabversion zum Ausprobieren).
on:
  push:
    tags: ["v*"]
    branches: ["test"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Tests vor dem Bauen
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
